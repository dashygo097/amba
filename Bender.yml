package:
  name: amba
  description: Reusable SystemVerilog AMBA components

dependencies:
  common_cells:
    { git: "https://github.com/dashygo097/common_cells.git", rev: main }
  dicflow: { git: "https://github.com/dashygo097/dicflow.git", rev: main }

export_include_dirs:
  - include

sources:
  - rtl/pkgs/axi5_pkg.sv
  - rtl/protocols/**/*.sv
  - rtl/adapters/**/*.sv
  - rtl/endpoints/**/*.sv
  - target: verify
    files:
      - rtl/pkgs/axi5_verify_pkg.sv
      - rtl/vips/axi5_lite_monitor.sv
      - rtl/vips/axi5_lite_vip.sv
  - target: all(verify, verify_axi5_lite_slv_regs)
    files:
      - tests/tb_axi5_lite_slv_regs.sv
  - target: all(verify, verify_axi5_lite_vip)
    files:
      - tests/tb_axi5_lite_vip.sv
